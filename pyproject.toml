[project]
name = "choice-server"
version = "0.1.0"
description = "A minimal GLiFormer classification API for GTX 1060"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "gliformer==0.1.2",
    "gliner==0.2.29",
    "transformers==5.16.1",
    "torch==2.7.1+cu126",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
